<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Migrate to Firebase - JJ's Wishlist</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #4a5568;
            margin-bottom: 10px;
        }
        .description {
            color: #718096;
            margin-bottom: 30px;
        }
        .status {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .status.info {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        .status.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
        }
        .status.error {
            background: #fff1f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }
        .data-summary {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .data-summary h3 {
            margin-top: 0;
            color: #4a5568;
        }
        .data-item {
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .data-item:last-child {
            border-bottom: none;
        }
        .progress {
            margin: 20px 0;
            display: none;
        }
        .progress-bar {
            background: #e2e8f0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Migrate to Firebase</h1>
        <p class="description">This tool will migrate your wishlist data from localStorage to Firebase Firestore.</p>
        
        <div id="statusMessage" class="status info">
            Ready to migrate. Click the button below to start.
        </div>
        
        <div class="progress" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>
        
        <div class="data-summary" id="dataSummary" style="display: none;">
            <h3>Found in localStorage:</h3>
            <div class="data-item"><strong>Wishlist Items:</strong> <span id="itemCount">0</span></div>
            <div class="data-item"><strong>Notifications:</strong> <span id="notificationCount">0</span></div>
            <div class="data-item"><strong>Custom Categories:</strong> <span id="categoryCount">0</span></div>
        </div>
        
        <button class="btn" id="checkDataBtn" onclick="checkLocalData()">Check Local Data</button>
        <button class="btn" id="migrateBtn" onclick="migrateData()" disabled>Start Migration</button>
        <button class="btn" id="viewWishlistBtn" onclick="window.location.href='index.html'" style="background: #38a169;">View Wishlist</button>
    </div>

    <script type="module">
        import dbService from './db-service.js';
        
        let localData = {
            items: [],
            notifications: [],
            categories: {}
        };
        
        window.checkLocalData = function() {
            const items = localStorage.getItem('wishlistItems');
            const notifications = localStorage.getItem('wishlistNotifications');
            const categories = localStorage.getItem('customCategories');
            
            localData.items = items ? JSON.parse(items) : [];
            localData.notifications = notifications ? JSON.parse(notifications) : [];
            localData.categories = categories ? JSON.parse(categories) : {};
            
            document.getElementById('itemCount').textContent = localData.items.length;
            document.getElementById('notificationCount').textContent = localData.notifications.length;
            document.getElementById('categoryCount').textContent = Object.keys(localData.categories).length;
            
            document.getElementById('dataSummary').style.display = 'block';
            
            if (localData.items.length > 0 || localData.notifications.length > 0 || Object.keys(localData.categories).length > 0) {
                document.getElementById('migrateBtn').disabled = false;
                updateStatus('Data found! Ready to migrate.', 'success');
            } else {
                updateStatus('No data found in localStorage.', 'info');
            }
        };
        
        window.migrateData = async function() {
            try {
                document.getElementById('migrateBtn').disabled = true;
                document.getElementById('checkDataBtn').disabled = true;
                document.getElementById('progressContainer').style.display = 'block';
                
                updateStatus('Migration in progress...', 'info');
                updateProgress(0);
                
                let progress = 0;
                const totalSteps = localData.items.length + localData.notifications.length + (Object.keys(localData.categories).length > 0 ? 1 : 0);
                
                // Migrate items
                updateStatus('Migrating wishlist items...', 'info');
                for (const item of localData.items) {
                    // Remove the id if it exists (Firestore will generate new ones)
                    const { id, ...itemData } = item;
                    await dbService.addItem(itemData);
                    progress++;
                    updateProgress((progress / totalSteps) * 100);
                }
                
                // Migrate notifications
                updateStatus('Migrating notifications...', 'info');
                for (const notification of localData.notifications) {
                    const { id, ...notificationData } = notification;
                    await dbService.addNotification(notificationData);
                    progress++;
                    updateProgress((progress / totalSteps) * 100);
                }
                
                // Migrate categories
                if (Object.keys(localData.categories).length > 0) {
                    updateStatus('Migrating custom categories...', 'info');
                    await dbService.saveCategories(localData.categories);
                    progress++;
                    updateProgress((progress / totalSteps) * 100);
                }
                
                updateProgress(100);
                updateStatus('✅ Migration completed successfully! All data has been moved to Firebase.', 'success');
                
                // Optional: Ask if user wants to clear localStorage
                setTimeout(() => {
                    if (confirm('Migration successful! Do you want to clear the old localStorage data? (Recommended)')) {
                        localStorage.removeItem('wishlistItems');
                        localStorage.removeItem('wishlistNotifications');
                        localStorage.removeItem('customCategories');
                        alert('localStorage cleared! You can now close this page.');
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Migration error:', error);
                updateStatus('❌ Migration failed: ' + error.message, 'error');
                document.getElementById('migrateBtn').disabled = false;
                document.getElementById('checkDataBtn').disabled = false;
            }
        };
        
        function updateStatus(message, type) {
            const statusDiv = document.getElementById('statusMessage');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
        
        function updateProgress(percentage) {
            const progressFill = document.getElementById('progressFill');
            progressFill.style.width = percentage + '%';
            progressFill.textContent = Math.round(percentage) + '%';
        }
    </script>
</body>
</html>
