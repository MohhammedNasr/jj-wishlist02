<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJ's Birthday Wishlist</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-text">
                    <h1><i class="fas fa-gift"></i> JJ's Birthday Wishlist</h1>
                    <p class="subtitle">Make my birthday special! 🎉</p>
                </div>
                <div class="header-image">
                    <img src="image/Untitled design.jpg" alt="Happy child with balloons celebrating" class="hero-image">
                </div>
            </div>
        </header>



        <!-- Wishlist Stats -->
        <div class="stats-section">
            <div class="stat-card">
                <i class="fas fa-gift"></i>
                <div class="stat-info">
                    <span class="stat-number" id="totalItems">0</span>
                    <span class="stat-label">Total Items</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-check-circle"></i>
                <div class="stat-info">
                    <span class="stat-number" id="purchasedItems">0</span>
                    <span class="stat-label">Purchased</span>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-heart"></i>
                <div class="stat-info">
                    <span class="stat-number" id="highPriorityItems">0</span>
                    <span class="stat-label">High Priority</span>
                </div>
            </div>
        </div>

        <!-- Wishlist Items -->
        <div class="wishlist-container">
            <div class="wishlist-grid" id="wishlistGrid">
                <!-- Items will be dynamically added here -->
            </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-gift"></i>
            <h3>No items in the wishlist yet</h3>
            <p>The birthday wishlist is empty. Check back later!</p>
        </div>

        <!-- Footer with subtle admin access -->
        <footer class="site-footer">
            <div class="footer-content">
                <p>&copy; 2025 JJ's Birthday Wishlist. Made with ❤️</p>
                <a href="admin-login.html" class="admin-link" title="Admin Access">JJ</a>
            </div>
        </footer>
    </div>

    <!-- Item Modal -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be populated here -->
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="db-service.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
